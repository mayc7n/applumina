##############################################
# Lumina — Development Profile
##############################################

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:lumina}

  data:
    redis:
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:lumina}

  rabbitmq:
    virtual-host: ${RABBITMQ_VHOST:/lumina}

  jpa:
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    show-sql: false

  flyway:
    out-of-order: true

  # Dev mail — MailHog or log only
  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

lumina:
  security:
    jwt:
      secret: dev-secret-key-minimum-32-chars-not-for-production-use-only
      access-token-expiration: 3600000      # 1 hour in dev
      refresh-token-expiration: 604800000   # 7 days in dev
    cors:
      allowed-origins: http://localhost:3000,http://localhost:3001
    cookies:
      secure: false

  rate-limit:
    enabled: false                           # Disable rate limiting in dev

  features:
    two-factor-auth: true
    social: true
    analytics: true
    ai-insights: false                       # Requires external API key

  storage:
    provider: local                          # Use local storage in dev

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.lumina: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: OFF

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: always
